name: Phase 3 validation

on:
  push:
    branches:
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Seed local D1
        run: npm run db:seed:local

      - name: Generate ephemeral admin auth
        run: |
          TEST_ADMIN_PASSWORD=$(node -e "process.stdout.write(require('crypto').randomBytes(18).toString('base64url'))")
          ADMIN_PASSWORD_HASH=$(ADMIN_PASSWORD="$TEST_ADMIN_PASSWORD" node scripts/hash-admin-password.mjs)
          ADMIN_SESSION_SECRET=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64url'))")

          echo "::add-mask::$TEST_ADMIN_PASSWORD"
          echo "::add-mask::$ADMIN_PASSWORD_HASH"
          echo "::add-mask::$ADMIN_SESSION_SECRET"

          cat > .dev.vars <<EOF
          ADMIN_USERNAME="admin"
          ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH"
          ADMIN_SESSION_SECRET="$ADMIN_SESSION_SECRET"
          EOF

          echo "TEST_ADMIN_PASSWORD=$TEST_ADMIN_PASSWORD" >> "$GITHUB_ENV"

          node --experimental-strip-types scripts/test-auth-session.mjs
          node --experimental-strip-types scripts/test-auth-password.mjs

      - name: Start local Workers runtime
        run: |
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.local.jsonc npm run dev -- --host 127.0.0.1 --port 8787 > /tmp/braimaru-dev.log 2>&1 &
          echo $! > /tmp/braimaru-dev.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /tmp/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/braimaru-dev.log
          exit 1

      - name: Test public API
        run: |
          curl --fail --silent http://127.0.0.1:8787/api/products > /tmp/products.json
          curl --fail --silent http://127.0.0.1:8787/api/categories > /tmp/categories.json
          curl --fail --silent http://127.0.0.1:8787/api/site > /tmp/site.json

          node - <<'NODE'
          const fs = require('fs');
          const products = JSON.parse(fs.readFileSync('/tmp/products.json', 'utf8')).products;
          const categories = JSON.parse(fs.readFileSync('/tmp/categories.json', 'utf8')).categories;
          const site = JSON.parse(fs.readFileSync('/tmp/site.json', 'utf8')).settings;

          if (products.length !== 3) throw new Error(`Expected 3 seeded products, got ${products.length}`);
          if (!products.every((product) => product.active === true)) throw new Error('Public API returned inactive product');
          if (categories.length !== 3) throw new Error(`Expected 3 categories, got ${categories.length}`);
          if (!Object.prototype.hasOwnProperty.call(site, 'whatsapp_phone')) throw new Error('Missing whatsapp_phone setting');
          NODE

      - name: Test admin authentication
        run: |
          ADMIN_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -D /tmp/admin-anon.headers http://127.0.0.1:8787/admin)
          test "$ADMIN_STATUS" = "302"
          grep -qi '^location: /admin/login' /tmp/admin-anon.headers

          API_STATUS=$(curl --silent --output /tmp/admin-api-anon.json --write-out '%{http_code}' http://127.0.0.1:8787/api/admin/products)
          test "$API_STATUS" = "401"

          WRONG_STATUS=$(curl --silent --output /tmp/login-wrong.json --write-out '%{http_code}'             -X POST             -H 'content-type: application/json'             --data '{"username":"admin","password":"wrong-password"}'             http://127.0.0.1:8787/api/auth/login)
          test "$WRONG_STATUS" = "401"

          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/login-wrong.json', 'utf8'));
          if (body?.error?.message !== 'Usuario o contraseña incorrectos.') {
            throw new Error('Wrong-login response leaked or changed credential details');
          }
          NODE

          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync(
            '/tmp/login-correct-request.json',
            JSON.stringify({
              username: 'admin',
              password: process.env.TEST_ADMIN_PASSWORD,
            }),
          );
          NODE

          curl --fail --silent \
            -D /tmp/login-ok.headers \
            -o /tmp/login-ok.json \
            -X POST \
            -H 'content-type: application/json' \
            --data @/tmp/login-correct-request.json \
            http://127.0.0.1:8787/api/auth/login

          grep -qi '^set-cookie: braimaru_admin_session=' /tmp/login-ok.headers
          grep -qi 'HttpOnly' /tmp/login-ok.headers
          grep -qi 'Secure' /tmp/login-ok.headers
          grep -qi 'SameSite=Strict' /tmp/login-ok.headers
          grep -qi 'Path=/' /tmp/login-ok.headers
          grep -qi 'Max-Age=28800' /tmp/login-ok.headers

          COOKIE_HEADER=$(grep -i '^set-cookie: braimaru_admin_session=' /tmp/login-ok.headers | head -n 1 | sed 's/^[Ss]et-[Cc]ookie: //' | cut -d';' -f1 | tr -d '\r')
          test -n "$COOKIE_HEADER"
          printf '%s' "$COOKIE_HEADER" > /tmp/admin-cookie-header

          curl --fail --silent             -H "Cookie: $COOKIE_HEADER"             http://127.0.0.1:8787/api/auth/session > /tmp/session.json

          node - <<'NODE'
          const fs = require('fs');
          const session = JSON.parse(fs.readFileSync('/tmp/session.json', 'utf8'));
          if (session.authenticated !== true || session.username !== 'admin') {
            throw new Error('Authenticated session check failed');
          }
          NODE

          AUTH_ADMIN_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}'             -H "Cookie: $COOKIE_HEADER"             http://127.0.0.1:8787/admin)
          test "$AUTH_ADMIN_STATUS" = "200"

          curl --fail --silent             -H "Cookie: $COOKIE_HEADER"             http://127.0.0.1:8787/api/admin/products > /tmp/admin-products-auth.json

      - name: Test admin site settings
        run: |
          COOKIE_HEADER=$(cat /tmp/admin-cookie-header)

          curl --fail --silent \
            -H "Cookie: $COOKIE_HEADER" \
            http://127.0.0.1:8787/api/admin/site > /tmp/admin-site-before.json

          cat > /tmp/site-settings-update.json <<'JSON'
          {
            "whatsapp_phone": "573001112233",
            "instagram_url": "https://instagram.com/braimaru_ci",
            "brand_email": "ci@example.com"
          }
          JSON

          curl --fail --silent \
            -X PUT \
            -H "Cookie: $COOKIE_HEADER" \
            -H 'content-type: application/json' \
            --data @/tmp/site-settings-update.json \
            http://127.0.0.1:8787/api/admin/site > /tmp/admin-site-updated.json

          node - <<'NODE'
          const fs = require('fs');
          const settings = JSON.parse(fs.readFileSync('/tmp/admin-site-updated.json', 'utf8')).settings;
          if (settings.whatsapp_phone !== '573001112233') throw new Error('WhatsApp setting update failed');
          if (settings.instagram_url !== 'https://instagram.com/braimaru_ci') throw new Error('Instagram setting update failed');
          if (settings.brand_email !== 'ci@example.com') throw new Error('Email setting update failed');
          NODE

          curl --fail --silent http://127.0.0.1:8787/api/site > /tmp/public-site-updated.json

          node - <<'NODE'
          const fs = require('fs');
          const settings = JSON.parse(fs.readFileSync('/tmp/public-site-updated.json', 'utf8')).settings;
          if (settings.whatsapp_phone !== '573001112233') throw new Error('Public WhatsApp setting did not update');
          NODE

          cat > /tmp/site-settings-restore.json <<'JSON'
          {
            "whatsapp_phone": null,
            "instagram_url": null,
            "brand_email": null
          }
          JSON

          curl --fail --silent \
            -X PUT \
            -H "Cookie: $COOKIE_HEADER" \
            -H 'content-type: application/json' \
            --data @/tmp/site-settings-restore.json \
            http://127.0.0.1:8787/api/admin/site > /tmp/admin-site-restored.json

          node - <<'NODE'
          const fs = require('fs');
          const settings = JSON.parse(fs.readFileSync('/tmp/admin-site-restored.json', 'utf8')).settings;
          if (settings.whatsapp_phone !== null || settings.instagram_url !== null || settings.brand_email !== null) {
            throw new Error('Site settings restore failed');
          }
          NODE

      - name: Test admin CRUD and R2 media lifecycle
        run: |
          COOKIE_HEADER=$(cat /tmp/admin-cookie-header)

          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl7lWQAAAAASUVORK5CYII=' | base64 --decode > /tmp/image-a.png
          cp /tmp/image-a.png /tmp/image-b.png

          curl --fail --silent             -X POST             -H "Cookie: $COOKIE_HEADER"             -H 'content-type: image/png'             --data-binary @/tmp/image-a.png             http://127.0.0.1:8787/api/admin/media > /tmp/media-a.json

          KEY_A=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/media-a.json','utf8')).key")
          curl --fail --silent "http://127.0.0.1:8787/media/$KEY_A" > /tmp/read-a.png

          cat > /tmp/create.json <<JSON
          {
            "name": "Producto prueba CI",
            "slug": "producto-prueba-ci",
            "category_id": "jabones",
            "short_description": "Registro temporal para validar el flujo administrativo.",
            "description": null,
            "benefits": ["Prueba"],
            "price_cop": null,
            "image_key": "$KEY_A",
            "ritual_tags": [],
            "featured": false,
            "active": true,
            "sort_order": 90
          }
          JSON

          curl --fail --silent             -X POST             -H "Cookie: $COOKIE_HEADER"             -H 'content-type: application/json'             --data @/tmp/create.json             http://127.0.0.1:8787/api/admin/products > /tmp/created.json

          PRODUCT_ID=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/created.json','utf8')).product.id")

          curl --fail --silent             -X POST             -H "Cookie: $COOKIE_HEADER"             -H 'content-type: image/png'             --data-binary @/tmp/image-b.png             http://127.0.0.1:8787/api/admin/media > /tmp/media-b.json

          KEY_B=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/media-b.json','utf8')).key")

          cat > /tmp/update-hidden.json <<JSON
          {
            "name": "Producto prueba CI editado",
            "slug": "producto-prueba-ci",
            "category_id": "jabones",
            "short_description": "Registro temporal editado.",
            "description": null,
            "benefits": ["Prueba editada"],
            "price_cop": 49900,
            "image_key": "$KEY_B",
            "ritual_tags": ["exfoliar"],
            "featured": true,
            "active": false,
            "sort_order": 91
          }
          JSON

          curl --fail --silent             -X PUT             -H "Cookie: $COOKIE_HEADER"             -H 'content-type: application/json'             --data @/tmp/update-hidden.json             "http://127.0.0.1:8787/api/admin/products/$PRODUCT_ID" > /tmp/updated-hidden.json

          STATUS_OLD=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8787/media/$KEY_A")
          test "$STATUS_OLD" = "404"

          node - <<'NODE'
          const fs = require('fs');
          const product = JSON.parse(fs.readFileSync('/tmp/updated-hidden.json', 'utf8')).product;
          if (product.active !== false) throw new Error('Deactivate flow failed');
          if (product.featured !== true) throw new Error('Featured update failed');
          if (product.sort_order !== 91) throw new Error('Order update failed');
          if (product.price_cop !== 49900) throw new Error('Price update failed');
          NODE

          node -e "
            const fs=require('fs');
            const data=JSON.parse(fs.readFileSync('/tmp/update-hidden.json','utf8'));
            data.active=true;
            fs.writeFileSync('/tmp/update-active.json', JSON.stringify(data));
          "

          curl --fail --silent             -X PUT             -H "Cookie: $COOKIE_HEADER"             -H 'content-type: application/json'             --data @/tmp/update-active.json             "http://127.0.0.1:8787/api/admin/products/$PRODUCT_ID" > /tmp/updated-active.json

          node - <<'NODE'
          const fs = require('fs');
          const product = JSON.parse(fs.readFileSync('/tmp/updated-active.json', 'utf8')).product;
          if (product.active !== true) throw new Error('Activate flow failed');
          NODE

          curl --fail --silent             -X DELETE             -H "Cookie: $COOKIE_HEADER"             "http://127.0.0.1:8787/api/admin/products/$PRODUCT_ID" > /tmp/deleted.json

          STATUS_NEW=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8787/media/$KEY_B")
          test "$STATUS_NEW" = "404"

          curl --fail --silent             -H "Cookie: $COOKIE_HEADER"             http://127.0.0.1:8787/api/admin/products > /tmp/admin-products-final.json

          node - <<'NODE'
          const fs = require('fs');
          const products = JSON.parse(fs.readFileSync('/tmp/admin-products-final.json', 'utf8')).products;
          if (products.some((product) => product.slug === 'producto-prueba-ci')) {
            throw new Error('Delete flow failed');
          }
          NODE

      - name: Test logout
        run: |
          COOKIE_HEADER=$(cat /tmp/admin-cookie-header)

          LOGOUT_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}'             -D /tmp/logout.headers             -X POST             -H "Cookie: $COOKIE_HEADER"             http://127.0.0.1:8787/api/auth/logout)
          test "$LOGOUT_STATUS" = "204"
          grep -qi 'Max-Age=0' /tmp/logout.headers

          SESSION_AFTER_LOGOUT=$(curl --silent --output /tmp/session-after-logout.json --write-out '%{http_code}'             http://127.0.0.1:8787/api/auth/session)
          test "$SESSION_AFTER_LOGOUT" = "401"

          API_AFTER_LOGOUT=$(curl --silent --output /tmp/admin-after-logout.json --write-out '%{http_code}'             http://127.0.0.1:8787/api/admin/products)
          test "$API_AFTER_LOGOUT" = "401"

      - name: Dump runtime log on failure
        if: failure()
        run: cat /tmp/braimaru-dev.log || true
